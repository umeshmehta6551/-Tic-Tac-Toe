<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A responsive 2-player Tic-Tac-Toe game built with HTML, CSS, and Vanilla JavaScript."
    />
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container" role="main">
      <header>
        <h1 class="title">Tic-Tac-Toe</h1>
      </header>

      <!-- Current player / result message -->
      <p
        class="status"
        id="status"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      >
        Player X's Turn
      </p>

      <!-- Game board -->
      <section
        class="board"
        id="board"
        role="grid"
        aria-label="Tic-Tac-Toe board"
      >
        <button
          class="cell"
          data-index="0"
          role="gridcell"
          aria-label="Cell 1, empty"
        ></button>
        <button
          class="cell"
          data-index="1"
          role="gridcell"
          aria-label="Cell 2, empty"
        ></button>
        <button
          class="cell"
          data-index="2"
          role="gridcell"
          aria-label="Cell 3, empty"
        ></button>
        <button
          class="cell"
          data-index="3"
          role="gridcell"
          aria-label="Cell 4, empty"
        ></button>
        <button
          class="cell"
          data-index="4"
          role="gridcell"
          aria-label="Cell 5, empty"
        ></button>
        <button
          class="cell"
          data-index="5"
          role="gridcell"
          aria-label="Cell 6, empty"
        ></button>
        <button
          class="cell"
          data-index="6"
          role="gridcell"
          aria-label="Cell 7, empty"
        ></button>
        <button
          class="cell"
          data-index="7"
          role="gridcell"
          aria-label="Cell 8, empty"
        ></button>
        <button
          class="cell"
          data-index="8"
          role="gridcell"
          aria-label="Cell 9, empty"
        ></button>
      </section>

      <!-- Scoreboard -->
      <section class="scoreboard" aria-label="Scoreboard">
        <div class="score-item">
          <span class="score-label player-x">Player X</span>
          <span class="score-value" id="score-x" aria-label="Player X score"
            >0</span
          >
        </div>
        <div class="score-item score-draws">
          <span class="score-label">Draws</span>
          <span class="score-value" id="score-draws" aria-label="Draws">0</span>
        </div>
        <div class="score-item">
          <span class="score-label player-o">Player O</span>
          <span class="score-value" id="score-o" aria-label="Player O score"
            >0</span
          >
        </div>
      </section>

      <!-- Action buttons -->
      <div class="actions">
        <button
          class="btn btn-primary"
          id="new-game-btn"
          aria-label="Start a new game"
        >
          New Game
        </button>
        <button
          class="btn btn-secondary"
          id="reset-score-btn"
          aria-label="Reset all scores"
        >
          Reset Score
        </button>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
